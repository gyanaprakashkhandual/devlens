<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Reader</title>

  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/tokens.css" />
  <link rel="stylesheet" href="css/base/themes.css" />
  <link rel="stylesheet" href="css/base/layout.css" />
  <link rel="stylesheet" href="css/base/topbar.css" />
  <link rel="stylesheet" href="css/base/sidebar.css" />
  <link rel="stylesheet" href="css/markdown/base.css" />
  <link rel="stylesheet" href="css/markdown/headings.css" />
  <link rel="stylesheet" href="css/markdown/lists.css" />
  <link rel="stylesheet" href="css/markdown/blockquote.css" />
  <link rel="stylesheet" href="css/markdown/table.css" />
  <link rel="stylesheet" href="css/markdown/code.css" />
  <link rel="stylesheet" href="css/markdown/media.css" />
  <link rel="stylesheet" href="css/markdown/footnotes.css" />
  <link rel="stylesheet" href="css/markdown/misc.css" />
  <link rel="stylesheet" href="css/highlight/highlight.css" />
  <link rel="stylesheet" href="css/components/components.css" />
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="topbar__brand">
        <button class="btn btn--icon" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar__logo">▤</span>
        <span class="topbar__name">MD Reader</span>
      </div>

      <div class="topbar__center">
        <div class="topbar__search">
          <svg class="topbar__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" placeholder="Search in document (Ctrl+F)..." id="search-trigger" readonly />
        </div>
      </div>

      <div class="topbar__actions">
        <span class="topbar__filename" id="filename-display"></span>

        <label class="btn btn--ghost btn--sm" for="file-input" title="Open .md file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          Open File
        </label>
        <input type="file" id="file-input" accept=".md,.markdown,.txt,.mdx" hidden />

        <button class="btn btn--icon" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app__body">

      <aside class="sidebar" id="sidebar" aria-label="Table of contents">
        <div class="sidebar__header">On this page</div>
        <div class="sidebar__empty">Open a markdown file to see its outline here.</div>
        <nav aria-label="Table of contents">
          <ul class="toc-list"></ul>
        </nav>
      </aside>

      <div class="sidebar__overlay" id="sidebar-overlay"></div>

      <main class="app__content" id="content-area">
        <div class="app__empty" id="empty-state">
          <div class="app__empty-icon">▤</div>
          <div class="app__empty-title">No file open</div>
          <div class="app__empty-sub">
            Open a markdown file to render it, or drag and drop a <code>.md</code> file anywhere on the page.
          </div>
          <div class="app__empty-actions">
            <label class="btn btn--primary" for="file-input">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
              </svg>
              Open File
            </label>
            <button class="btn btn--ghost" id="load-demo">Load Demo</button>
          </div>
        </div>

        <article class="markdown-body" id="markdown-output" style="display:none;" aria-live="polite"></article>
      </main>

    </div>

    <div class="search-bar" id="search-bar" role="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search in document..." id="search-input" autocomplete="off" spellcheck="false" />
      <span class="search-bar__count" id="search-count" aria-live="polite"></span>
      <button class="btn btn--icon btn--sm" id="search-prev" title="Previous (Shift+Enter)" aria-label="Previous result">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="18,15 12,9 6,15"/>
        </svg>
      </button>
      <button class="btn btn--icon btn--sm" id="search-next" title="Next (Enter)" aria-label="Next result">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6,9 12,15 18,9"/>
        </svg>
      </button>
      <button class="btn btn--icon btn--sm" id="search-close" title="Close (Esc)" aria-label="Close search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
      <div class="drop-overlay__inner">
        <div class="drop-overlay__icon">📄</div>
        <div class="drop-overlay__text">Drop your markdown file here</div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
